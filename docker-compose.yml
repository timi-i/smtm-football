version: "3.9"

services:
  intel-service:
    build:
      context: .
      dockerfile: Dockerfile
    image: smtm-intel:latest
    container_name: smtm-intel
    restart: unless-stopped
    volumes:
      - ./data:/app/daily-football-predictor/data
      - ./logs:/app/logs
    env_file:
      - ./intel-service/.env
    environment:
      - TZ=Asia/Shanghai
      - PREDICTIONS_PATH=/app/daily-football-predictor/data/predictions.json
      - ADJUSTMENTS_PATH=/app/daily-football-predictor/data/adjustments.json
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://127.0.0.1:4173/", "-o", "/dev/null"]
      interval: 5m
      timeout: 5s
      retries: 2
      start_period: 10s
